<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | StreamVault</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="blog">
<div id="site-header"></div>
<main class="container">
  <h1 class="page-title">The StreamVault Blog</h1>
  <p class="page-sub">Product news, creator spotlights, and the engineering behind the player.</p>
  <div class="blog-grid" id="blog-grid"></div>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("blog-grid").innerHTML = BLOG_POSTS.map(p=>`
    <a class="post-card" href="blog-post.html?p=${p.slug}">
      <div class="cover" style="background:linear-gradient(135deg,${p.grad[0]},${p.grad[1]})">${p.emoji}</div>
      <div class="body">
        <span class="tag">${p.tag}</span>
        <h3>${p.title}</h3>
        <p>${p.excerpt}</p>
        <span class="date">${p.date}</span>
      </div>
    </a>`).join("");
});
</script>
</body>
</html>
