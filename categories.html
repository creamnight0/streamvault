<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories | StreamVault</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="categories">
<div id="site-header"></div>
<main class="container">
  <h1 class="page-title">Categories</h1>
  <p style="text-align:center;color:var(--text-dim);margin-bottom:10px">Browse every corner of StreamVault.</p>
  <div class="cat-grid" id="cat-grid"></div>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("cat-grid").innerHTML = CATEGORIES.map(c=>`
    <a class="cat-tile" href="category.html?cat=${c.slug}">
      <span class="emoji">${c.emoji}</span><b>${c.name}</b>
      <span>${c.count.toLocaleString()} videos</span>
    </a>`).join("");
});
</script>
</body>
</html>
